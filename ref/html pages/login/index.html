<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign In - ScentScape">
    <title>Sign In - ScentScape</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    
    <!-- Ambient Glows -->
    <div class="auth-ambient-glow glow-1"></div>
    <div class="auth-ambient-glow glow-2"></div>

    <!-- Minimalist Top Navigation -->
    <header class="auth-minimal-nav">
        <a href="../index.html" class="auth-back-link">
            <i class="fas fa-arrow-left"></i>
            <span>Home</span>
        </a>
        <a href="../index.html" class="auth-brand-logo">
            <span>ScentScape</span>
        </a>
        <div class="auth-nav-placeholder"></div>
    </header>

    <!-- Minimalist Auth Card -->
    <main class="auth-minimal-wrapper">
        <div class="auth-minimal-card">
            
            <!-- Minimal Header -->
            <div class="auth-card-header">
                <h1 class="auth-card-title" id="authHeading">Sign In</h1>
                <p class="auth-card-subtitle" id="authSubheading">Welcome back to ScentScape</p>
            </div>

            <!-- Minimal Tab Switcher -->
            <div class="auth-pill-toggle">
                <button type="button" class="auth-pill-btn active" data-form="login">Sign In</button>
                <button type="button" class="auth-pill-btn" data-form="register">Register</button>
            </div>

            <!-- Sign In Form -->
            <div class="auth-form-container active" id="loginForm">
                <form class="auth-minimal-form" id="loginFormElement">
                    <!-- Email -->
                    <div class="auth-input-group">
                        <label for="loginEmail">Email</label>
                        <div class="auth-input-field">
                            <input 
                                type="email" 
                                id="loginEmail" 
                                name="email" 
                                class="auth-clean-input" 
                                placeholder="name@example.com"
                                required
                                autocomplete="email"
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="auth-input-group">
                        <div class="auth-label-row">
                            <label for="loginPassword">Password</label>
                            <a href="#" class="auth-forgot-link">Forgot?</a>
                        </div>
                        <div class="auth-input-field">
                            <input 
                                type="password" 
                                id="loginPassword" 
                                name="password" 
                                class="auth-clean-input" 
                                placeholder="••••••••"
                                required
                                autocomplete="current-password"
                            >
                            <button type="button" class="auth-eye-btn" data-target="loginPassword" aria-label="Toggle password visibility">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="auth-remember-row">
                        <label class="auth-minimal-checkbox">
                            <input type="checkbox" name="remember">
                            <span class="custom-check"></span>
                            <span class="check-text">Remember me</span>
                        </label>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="auth-action-btn">
                        <span>Continue</span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="auth-clean-divider">
                    <span>or</span>
                </div>

                <!-- Google Sign In -->
                <button type="button" class="auth-clean-social-btn google full-width">
                    <i class="fab fa-google"></i>
                    <span>Continue with Google</span>
                </button>

                <!-- Footer Switch -->
                <div class="auth-card-footer">
                    <span>New here?</span>
                    <a href="#" class="auth-switch-link" data-switch="register">Create an account</a>
                </div>
            </div>

            <!-- Register Form -->
            <div class="auth-form-container" id="registerForm">
                <form class="auth-minimal-form" id="registerFormElement">
                    <!-- Name -->
                    <div class="auth-input-group">
                        <label for="registerName">Name</label>
                        <div class="auth-input-field">
                            <input 
                                type="text" 
                                id="registerName" 
                                name="name" 
                                class="auth-clean-input" 
                                placeholder="Your name"
                                required
                                autocomplete="name"
                            >
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="auth-input-group">
                        <label for="registerEmail">Email</label>
                        <div class="auth-input-field">
                            <input 
                                type="email" 
                                id="registerEmail" 
                                name="email" 
                                class="auth-clean-input" 
                                placeholder="name@example.com"
                                required
                                autocomplete="email"
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="auth-input-group">
                        <label for="registerPassword">Password</label>
                        <div class="auth-input-field">
                            <input 
                                type="password" 
                                id="registerPassword" 
                                name="password" 
                                class="auth-clean-input" 
                                placeholder="At least 6 characters"
                                required
                                autocomplete="new-password"
                            >
                            <button type="button" class="auth-eye-btn" data-target="registerPassword" aria-label="Toggle password visibility">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength">
                            <div class="strength-bar">
                                <div class="strength-bar-fill"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Terms -->
                    <div class="auth-remember-row">
                        <label class="auth-minimal-checkbox">
                            <input type="checkbox" name="terms" required>
                            <span class="custom-check"></span>
                            <span class="check-text">I agree to the <a href="#" class="terms-link">Terms & Privacy</a></span>
                        </label>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="auth-action-btn">
                        <span>Create Account</span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="auth-clean-divider">
                    <span>or</span>
                </div>

                <!-- Google Sign Up -->
                <button type="button" class="auth-clean-social-btn google full-width">
                    <i class="fab fa-google"></i>
                    <span>Continue with Google</span>
                </button>

                <!-- Footer Switch -->
                <div class="auth-card-footer">
                    <span>Already have an account?</span>
                    <a href="#" class="auth-switch-link" data-switch="login">Sign In</a>
                </div>
            </div>

        </div>
    </main>

    <script src="../assets/js/script.js"></script>
</body>
</html>
